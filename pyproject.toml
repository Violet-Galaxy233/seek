[project]
name = "seek-music"
version = "0.1.0"
description = "Local-first Japanese album-cover retrieval prototype"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.13",
    "fastapi>=0.116",
    "gradio>=6.0",
    "huggingface-hub>=0.34",
    "numpy>=2.0",
    "pillow>=11.3",
    "qwen-vl-utils>=0.0.14",
    "requests>=2.34",
    "sentence-transformers>=5.1",
    "torchvision>=0.23",
    "uvicorn>=0.35",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["data", "indexes", "models"]
line-length = 100
target-version = "py311"
